<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111111" />
  <title>BLACKWOOD // GROOMING</title>
  <meta name="description" content="BLACKWOOD — мужской груминг. Собери свой ритуал и выбери время." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Unbounded:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{--bg:#111111;--panel:#181818;--line:#2a2a2a;--accent:#ff4d00;--text:#ecebe5;--muted:#94948e}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:24px}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif}
    button,input{font:inherit}
    button,a,input{-webkit-tap-highlight-color:transparent}
    button{cursor:pointer;color:inherit}
    button:disabled{cursor:not-allowed;opacity:.35}
    a{color:inherit;text-decoration:none}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:5px}
    ::selection{background:var(--accent);color:var(--bg)}
    .mono{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.04em}
    .display{font-family:Unbounded,sans-serif}
    .muted{color:var(--muted)}
    .orange{color:var(--accent)}
    .shell{max-width:1600px;margin:auto;border-inline:1px solid var(--line)}
    .ticker{overflow:hidden;background:var(--accent);color:var(--bg);padding:9px 0;font-weight:700}
    .ticker-track{display:flex;gap:60px;width:max-content;animation:ticker 35s linear infinite}
    .ticker-track span{white-space:nowrap}
    @keyframes ticker{to{transform:translateX(-50%)}}
    nav{display:flex;align-items:center;justify-content:space-between;padding:26px 4%;border-bottom:1px solid var(--line)}
    .brand{font-weight:800;font-size:17px;letter-spacing:-1px}
    .brand small{font:10px "Space Mono",monospace;letter-spacing:3px;display:block;margin-top:5px}
    .nav-links{display:flex;gap:30px;align-items:center}
    .nav-links a:hover{color:var(--accent)}
    .nav-book{border:1px solid var(--line);padding:13px 18px}
    .hero{position:relative;padding:44px 4% 0;overflow:hidden}
    .hero-label{display:flex;justify-content:space-between;gap:20px;margin-bottom:44px}
    .status{display:inline-flex;gap:9px;align-items:center}
    .status:before{content:"";width:6px;height:6px;background:var(--accent);border-radius:50%}
    h1{font-size:clamp(40px,9.4vw,151px);line-height:1.04;letter-spacing:-.075em;margin:0;font-weight:900}
    .outline{color:transparent;-webkit-text-stroke:1px #a8a8a0;display:block;margin-left:8%}
    .hero-bottom{display:grid;grid-template-columns:1fr 1fr .7fr;align-items:end;gap:45px;margin-top:48px}
    .hero-copy{font-size:14px;line-height:1.8;max-width:330px;padding-bottom:35px}
    .hero-index{align-self:stretch;border-left:1px solid var(--line);padding:15px 0 35px 25px;display:flex;flex-direction:column;justify-content:space-between}
    .hero-index .cross{font-size:50px;font-weight:300;line-height:1;color:var(--accent)}
    .rate{border-top:4px solid var(--accent);background:var(--panel);padding:24px}
    .rate strong{font:700 clamp(20px,2.4vw,36px) "Space Mono",monospace;display:block;margin:22px 0 8px;white-space:nowrap}
    .section-bar{border-block:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:20px 4%;gap:20px}
    .section-bar h2{font-size:13px;margin:0;letter-spacing:-.03em}
    .builder{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(310px,1fr)}
    .controls{min-width:0;border-right:1px solid var(--line)}
    .step{padding:32px 6%;border-bottom:1px solid var(--line)}
    .step-head{display:flex;justify-content:space-between;gap:16px;margin-bottom:24px;align-items:baseline}
    .step-head h3{font-size:15px;margin:0;letter-spacing:-.03em}
    .step-head h3 span{color:var(--accent);font:12px "Space Mono",monospace;margin-right:15px}
    .master-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .master{background:transparent;border:1px solid var(--line);padding:19px 12px;text-align:left;min-height:112px;position:relative;transition:background .2s,border-color .2s}
    .master b{display:block;font-size:13px;margin:14px 0 10px}
    .master .marker{position:absolute;top:12px;right:12px;width:7px;height:7px;border:1px solid #666}
    .master.selected{border-color:var(--accent);background:#211a16}
    .master.selected .marker{background:var(--accent);border-color:var(--accent)}
    .service{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:20px 0;display:grid;grid-template-columns:26px 1fr auto;gap:10px;text-align:left;align-items:center}
    .service:first-child{border-top:1px solid var(--line)}
    .radio{width:15px;height:15px;border:1px solid #666;border-radius:50%;position:relative}
    .service.selected .radio{border-color:var(--accent)}
    .service.selected .radio:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
    .service.selected .service-name,.service.selected .price{color:var(--accent)}
    .service-name{font-size:14px}
    .price{white-space:nowrap}
    .options{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px}
    .option{background:none;border:0;text-align:left;display:flex;gap:10px;padding:10px 0;align-items:flex-start}
    .box{width:16px;height:16px;border:1px solid #666;flex:none;display:grid;place-items:center;font-size:12px}
    .option.selected .box{background:var(--accent);border-color:var(--accent);color:#111}
    .option-title{font-size:12px;display:block;line-height:1.5}
    .option-price{display:block;margin-top:5px;color:var(--muted);font-size:10px}
    .date-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
    .arrows{display:flex;gap:8px}
    .arrow{border:1px solid var(--line);background:none;width:36px;height:36px}
    .dates{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
    .date{border:1px solid var(--line);background:none;padding:12px 2px;min-width:0}
    .date strong{font:20px "Space Mono",monospace;display:block;margin-top:8px}
    .date.selected,.time.selected{background:var(--accent);color:#111;border-color:var(--accent)}
    .times{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:20px}
    .time{background:none;border:1px solid var(--line);padding:12px 0;font:11px "Space Mono",monospace}
    .booking-note{font-size:10px;line-height:1.8;margin:16px 0 0;color:var(--muted)}
    .receipt-column{padding:34px 8%;background:var(--panel)}
    .receipt-wrap{position:sticky;top:28px}
    .receipt{background:var(--text);color:#171717;position:relative}
    .receipt-top{padding:25px 24px;border-bottom:1px solid #bdbdb4}
    .receipt-brand{font:800 20px Unbounded,sans-serif;letter-spacing:-1px;margin-bottom:10px}
    .receipt-sub{display:flex;justify-content:space-between;gap:8px;font-size:9px}
    .receipt-body{padding:25px 24px}
    .ticket-label{font-size:9px;color:#686860}
    .ticket-value{font-size:13px;margin:8px 0 24px;line-height:1.6}
    .ticket-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    .ticket-row .ticket-value{font:16px "Space Mono",monospace;margin-bottom:20px}
    .ticket-options{list-style:none;padding:0;margin:0 0 20px;font-size:10px;line-height:1.9}
    .total{border-top:1px dashed #99998e;padding-top:22px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px}
    .total strong{font:700 clamp(24px,2.3vw,34px) "Space Mono",monospace;letter-spacing:-2px;white-space:nowrap}
    .barcode{height:46px;display:flex;gap:2px;margin-top:28px;overflow:hidden}
    .barcode span{background:#171717;flex-shrink:0}
    .ticket-bottom{padding:15px 24px;border-top:1px dashed #a4a49b;display:flex;justify-content:space-between;gap:8px;font-size:8px}
    .confirm{width:100%;border:0;background:var(--accent);color:#111;padding:22px 15px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:11px;font-weight:800;line-height:1.5;text-align:left;transition:background .2s}
    .confirm:hover{background:#ff6a29}
    .receipt-caption{font-size:10px;line-height:1.8;margin-top:20px;color:var(--muted)}
    .manifest{padding:58px 4%;display:grid;grid-template-columns:.7fr 2fr;gap:30px;border-bottom:1px solid var(--line)}
    .manifest p{font:600 clamp(19px,3vw,40px)/1.5 Unbounded,sans-serif;letter-spacing:-.05em;margin:0;max-width:950px}
    footer{padding:25px 4%;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
    footer a:hover{color:var(--accent)}
    .overlay{position:fixed;inset:0;background:#000c;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
    .modal{width:100%;max-width:480px;max-height:90dvh;overflow:auto;border:1px solid #444;background:var(--bg);padding:32px;position:relative;animation:enter .2s ease-out}
    @keyframes enter{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
    .close{position:absolute;right:15px;top:15px;width:36px;height:36px;background:none;border:1px solid var(--line);font-size:22px}
    .modal h2{font:700 24px/1.4 Unbounded,sans-serif;letter-spacing:-1px;margin:24px 0}
    .modal label{display:block;font-size:11px;margin:23px 0 8px}
    .modal input{width:100%;border:1px solid #444;background:var(--panel);padding:15px;color:var(--text);border-radius:0}
    .modal .confirm{margin-top:24px}
    .success-icon{width:54px;height:54px;background:var(--accent);color:#111;display:grid;place-items:center;font-size:28px;margin-top:16px}
    .error{color:#ff8351;font-size:12px;line-height:1.5}
    @media(min-width:1600px){h1{font-size:151px}}
    @media(max-width:900px){.builder{grid-template-columns:minmax(0,1.3fr) minmax(285px,1fr)}.receipt-column{padding:26px 6%}.times{grid-template-columns:repeat(4,1fr)}.options{grid-template-columns:1fr}.nav-location{display:none}.hero-bottom{gap:24px}.hero-index{padding-left:18px}}
    @media(max-width:680px){.shell{border:0}nav{padding:22px 5%}.brand{font-size:15px}.nav-links{gap:0}.nav-links>a:not(.nav-book){display:none}.nav-book{font-size:10px;padding:12px}.hero{padding:30px 5% 0}.hero-label{font-size:8px;margin-bottom:35px}.hero-label>span:last-child{display:none}h1{font-size:10vw;letter-spacing:-.075em}.outline{margin:12px 0 0 3%}.hero-bottom{grid-template-columns:1fr 1fr;margin-top:34px;gap:20px}.hero-copy{font-size:12px;padding-bottom:22px}.hero-index{display:none}.rate{padding:17px}.rate strong{font-size:21px;margin-top:22px}.rate .mono{font-size:9px}.section-bar{padding:20px 5%}.section-bar h2{font-size:11px}.section-bar>.mono{font-size:8px}.builder{grid-template-columns:1fr}.controls{border-right:0}.step{padding:28px 5%}.step-head h3{font-size:13px}.step-head>.mono{font-size:8px}.master{padding:17px 9px}.master b{font-size:11px}.master .mono{font-size:9px}.service-name{font-size:12px}.price{font-size:11px}.options{grid-template-columns:1fr 1fr;gap:8px 14px}.dates{gap:4px}.date .mono{font-size:8px}.date strong{font-size:18px}.times{grid-template-columns:repeat(4,1fr)}.receipt-column{padding:30px 7%}.receipt-wrap{position:static}.receipt-caption{max-width:310px}.manifest{padding:36px 5%;grid-template-columns:1fr;gap:20px}.manifest p{font-size:20px}footer{padding:25px 5%;font-size:9px}.modal{padding:28px 22px}.modal h2{font-size:21px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.ticker-track{animation:none}.modal{animation:none}*{transition:none!important}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
const SERVICES=[
  {name:"Классическая стрижка",price:10000},
  {name:"Моделирование бороды",price:7000},
  {name:"Комплекс",price:15000},
  {name:"Королевское бритье",price:9000}
];
const MASTERS=[{name:"Барбер",price:0},{name:"Топ-мастер",price:3000},{name:"Шеф-барбер",price:5000}];
const EXTRAS=[{name:"Камуфляж седины",price:6000},{name:"Уход за лицом",price:4000},{name:"Стайлинг",price:2500},{name:"Эспрессо / Виски",price:0}];
const money=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ")+" ₸";
const TIMES=Array.from({length:22},(_,i)=>`${String(11+Math.floor(i/2)).padStart(2,"0")}:${i%2?"30":"00"}`);
const ZONE="Asia/Qyzylorda";
function dateKey(date){return new Intl.DateTimeFormat("en-CA",{timeZone:ZONE,year:"numeric",month:"2-digit",day:"2-digit"}).format(date)}
const START_KEY=dateKey(new Date());
const START=new Date(START_KEY+"T12:00:00+05:00");
const DATES=Array.from({length:28},(_,i)=>{const d=new Date(START);d.setUTCDate(d.getUTCDate()+i);return d});
const fmt=(d,options)=>new Intl.DateTimeFormat("ru-RU",{timeZone:ZONE,...options}).format(d);
function isPast(d,t){return new Date(`${dateKey(d)}T${t}:00+05:00`).getTime()<=Date.now()}
const BARCODE=Array.from({length:75},(_,i)=>1+((i*7+i*i)%4));
function App(){
  const [master,setMaster]=useState(0);
  const [service,setService]=useState(0);
  const [extras,setExtras]=useState([]);
  const [date,setDate]=useState(()=>DATES.find(d=>!isPast(d,"21:30"))||DATES[0]);
  const [time,setTime]=useState(()=>TIMES.find(t=>!isPast(DATES[0],t))||"11:00");
  const [page,setPage]=useState(0);
  const [modal,setModal]=useState(false);
  const [success,setSuccess]=useState(null);
  const [name,setName]=useState("");
  const [phone,setPhone]=useState("");
  const [error,setError]=useState("");
  const [clock,setClock]=useState(new Date());
  const dialog=useRef(null);
  const trigger=useRef(null);
  const total=SERVICES[service].price+MASTERS[master].price+extras.reduce((s,i)=>s+EXTRAS[i].price,0);
  useEffect(()=>{const id=setInterval(()=>setClock(new Date()),30000);return()=>clearInterval(id)},[]);
  useEffect(()=>{
    if(!modal)return;
    const previous=document.activeElement;
    document.body.style.overflow="hidden";
    const timer=setTimeout(()=>dialog.current?.querySelector("input,button")?.focus(),0);
    function key(e){
      if(e.key==="Escape"){setModal(false);return}
      if(e.key==="Tab"){
        const nodes=dialog.current.querySelectorAll('button:not(:disabled),input,a[href]');
        const first=nodes[0],last=nodes[nodes.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
      }
    }
    document.addEventListener("keydown",key);
    return()=>{clearTimeout(timer);document.body.style.overflow="";document.removeEventListener("keydown",key);previous?.focus()};
  },[modal]);
  function chooseDate(d){
    setDate(d);
    if(isPast(d,time))setTime(TIMES.find(t=>!isPast(d,t))||"11:00");
    setError("");
  }
  function openBooking(){setSuccess(null);setError("");setModal(true)}
  function submit(e){
    e.preventDefault();
    const digits=phone.replace(/\D/g,"");
    if(!name.trim()||digits.length!==11||!["7","8"].includes(digits[0])){
      setError("Укажите имя и телефон из 11 цифр, начинающийся с +7 или 8.");return;
    }
    if(isPast(date,time)){setError("Это время уже прошло. Закройте окно и выберите следующий слот.");return}
    const booking={
      id:"BW-"+Date.now().toString(36).toUpperCase(),
      name:name.trim(),phone,master:MASTERS[master].name,
      service:SERVICES[service].name,extras:extras.map(i=>EXTRAS[i].name),
      date:dateKey(date),time,total
    };
    try{
      const stored=JSON.parse(localStorage.getItem("blackwood-bookings")||"[]");
      localStorage.setItem("blackwood-bookings",JSON.stringify([...(Array.isArray(stored)?stored:[]),booking]));
      setSuccess(booking);setError("");
    }catch{setError("Браузер не разрешил сохранить запись. Разрешите локальное хранилище и повторите.")}
  }
  function downloadBooking(){
    const b=success;
    const content=`BLACKWOOD // GROOMING\n${b.id}\n\n${b.name}\n${b.phone}\n${b.service}\n${b.master}\n${b.extras.join(", ")}\n${b.date} / ${b.time} (UTC+5)\nИтого: ${money(b.total)}\n\nЛокальная запись. Подтверждение барбершопом не выполнялось.`;
    const url=URL.createObjectURL(new Blob([content],{type:"text/plain;charset=utf-8"}));
    const link=document.createElement("a");link.href=url;link.download=b.id+".txt";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  return <div className="shell" id="top">
    <div className="ticker mono" aria-label="Точность — наша привычка. Мужской груминг.">
      <div className="ticker-track" aria-hidden="true">{[0,1,2,3].map(i=><span key={i}>BLACKWOOD // GROOMING &nbsp; + &nbsp; PRECISION IS A HABIT &nbsp; + &nbsp; НИЧЕГО ЛИШНЕГО. ТОЛЬКО ХАРАКТЕР. &nbsp; +</span>)}</div>
    </div>
    <nav aria-label="Основная навигация">
      <a className="brand display" href="#top">BLACKWOOD<span className="orange">®</span><small>// GROOMING DEPARTMENT</small></a>
      <span className="nav-location mono muted">KZ / UTC+05<br/>11:00 — 22:00</span>
      <div className="nav-links mono"><a href="#manifest">ФИЛОСОФИЯ</a><a href="#booking">УСЛУГИ</a><a className="nav-book" href="#booking">ЗАПИСАТЬСЯ ↗</a></div>
    </nav>
    <main>
      <section className="hero" aria-labelledby="hero-title">
        <div className="hero-label mono"><span className="status">СИСТЕМА ГОТОВА К ЗАПИСИ</span><span className="muted">LOCAL TIME / {fmt(clock,{hour:"2-digit",minute:"2-digit",hour12:false})}</span><span>EST. FOR THE INDIVIDUAL</span></div>
        <h1 className="display" id="hero-title">ТОЧНОСТЬ.<span className="outline">ХАРАКТЕР.</span></h1>
        <div className="hero-bottom">
          <p className="hero-copy">Убираем лишнее. Оставляем твоё.<br/><span className="muted">Мужской груминг как точная инженерия — без случайных линий и компромиссов.</span></p>
          <div className="hero-index"><span className="mono muted">FORM FOLLOWS CHARACTER</span><span className="cross" aria-hidden="true">＋</span><a className="mono" href="#booking">СОБРАТЬ СВОЙ РИТУАЛ ↓</a></div>
          <div className="rate"><span className="mono muted">БАЗОВАЯ СТАВКА / СТРИЖКА</span><strong>10 000 <span className="orange">₸</span></strong><span className="mono muted">ЧИСТАЯ ФОРМА. ТОЧНАЯ РАБОТА.</span></div>
        </div>
      </section>
      <section id="booking" aria-labelledby="booking-title">
        <div className="section-bar"><h2 className="display" id="booking-title">КОНСТРУКТОР ЗАПИСИ <span className="orange">↘</span></h2><span className="mono muted">CONFIGURATOR / 01—04</span></div>
        <div className="builder">
          <div className="controls">
            <section className="step">
              <div className="step-head"><h3 className="display"><span>01</span>ВЫБЕРИ МАСТЕРА</h3><span className="mono muted">УРОВЕНЬ ТОЧНОСТИ</span></div>
              <div className="master-grid">{MASTERS.map((m,i)=><button type="button" key={m.name} className={"master "+(master===i?"selected":"")} aria-pressed={master===i} onClick={()=>setMaster(i)}><span className="mono muted">M / 0{i+1}</span><span className="marker" aria-hidden="true"/><b>{m.name}</b><span className="mono">+{money(m.price)}</span></button>)}</div>
            </section>
            <section className="step">
              <div className="step-head"><h3 className="display"><span>02</span>ОПРЕДЕЛИ ФОРМУ</h3><span className="mono muted">ОДНА УСЛУГА</span></div>
              <div>{SERVICES.map((s,i)=><button type="button" key={s.name} className={"service "+(service===i?"selected":"")} aria-pressed={service===i} onClick={()=>setService(i)}><span className="radio" aria-hidden="true"/><span className="service-name">{s.name}</span><span className="mono price">{money(s.price)}</span></button>)}</div>
            </section>
            <section className="step">
              <div className="step-head"><h3 className="display"><span>03</span>ДОБАВЬ ДЕТАЛИ</h3><span className="mono muted">ПО ЖЕЛАНИЮ</span></div>
              <div className="options">{EXTRAS.map((x,i)=><button type="button" key={x.name} className={"option "+(extras.includes(i)?"selected":"")} role="checkbox" aria-checked={extras.includes(i)} onClick={()=>setExtras(prev=>prev.includes(i)?prev.filter(n=>n!==i):[...prev,i])}><span className="box" aria-hidden="true">{extras.includes(i)?"✓":""}</span><span><span className="option-title">{x.name}</span><span className="option-price mono">{x.price?"+":""}{money(x.price)}</span></span></button>)}</div>
            </section>
            <section className="step">
              <div className="step-head"><h3 className="display"><span>04</span>ЗАФИКСИРУЙ ВРЕМЯ</h3><span className="mono muted">UTC+05</span></div>
              <div className="date-heading"><span className="mono">{fmt(DATES[page*7],{month:"long",year:"numeric"}).toUpperCase()}</span><div className="arrows"><button className="arrow" disabled={page===0} onClick={()=>setPage(p=>p-1)} aria-label="Предыдущая неделя">←</button><button className="arrow" disabled={page===3} onClick={()=>setPage(p=>p+1)} aria-label="Следующая неделя">→</button></div></div>
              <div className="dates">{DATES.slice(page*7,page*7+7).map(d=><button key={dateKey(d)} disabled={isPast(d,"21:30")} className={"date "+(dateKey(date)===dateKey(d)?"selected":"")} aria-pressed={dateKey(date)===dateKey(d)} aria-label={fmt(d,{day:"numeric",month:"long",weekday:"long"})} onClick={()=>chooseDate(d)}><span className="mono">{fmt(d,{weekday:"short"}).toUpperCase()}</span><strong>{fmt(d,{day:"2-digit"})}</strong></button>)}</div>
              <div className="times">{TIMES.map(t=><button key={t} disabled={isPast(date,t)} className={"time "+(time===t?"selected":"")} aria-pressed={time===t} onClick={()=>setTime(t)}>{t}</button>)}</div>
              <p className="booking-note mono">ПОСЛЕДНИЙ СЛОТ — 21:30 / ПРОШЕДШЕЕ ВРЕМЯ НЕДОСТУПНО</p>
            </section>
          </div>
          <aside className="receipt-column" aria-label="Ваша запись">
            <div className="receipt-wrap">
              <div className="step-head"><span className="mono muted">ТВОЙ ПРОПУСК</span><span className="mono orange">↙ LIVE UPDATE</span></div>
              <div className="receipt">
                <div className="receipt-top"><div className="receipt-brand">BLACKWOOD</div><div className="receipt-sub mono"><span>GROOMING PASS</span><span>BW / 001</span></div></div>
                <div className="receipt-body">
                  <div className="ticket-label mono">УСЛУГА / SERVICE</div><div className="ticket-value">{SERVICES[service].name}</div>
                  <div className="ticket-label mono">МАСТЕР / SPECIALIST</div><div className="ticket-value">{MASTERS[master].name}</div>
                  <div className="ticket-row"><div><div className="ticket-label mono">ДАТА / DATE</div><div className="ticket-value">{fmt(date,{day:"2-digit",month:"2-digit"})}</div></div><div><div className="ticket-label mono">ВРЕМЯ / TIME</div><div className="ticket-value">{time}</div></div></div>
                  {extras.length>0&&<ul className="ticket-options mono">{extras.map(i=><li key={i}>+ {EXTRAS[i].name} / {money(EXTRAS[i].price)}</li>)}</ul>}
                  <div className="total" aria-live="polite" aria-atomic="true"><span className="mono">ИТОГО</span><strong>{money(total)}</strong></div>
                  <div className="barcode" aria-hidden="true">{BARCODE.map((w,i)=><span key={i} style={{width:w}}/>)}</div>
                </div>
                <div className="ticket-bottom mono"><span>PERSONAL ACCESS ONLY</span><span>BW—KZ / UTC+05</span></div>
              </div>
              <button ref={trigger} type="button" className="confirm" onClick={openBooking}>ПОДТВЕРДИТЬ БРОНИРОВАНИЕ <span style={{fontSize:23}}>↗</span></button>
              <p className="receipt-caption mono">ДЕМО-КОНСТРУКТОР: ЗАПИСЬ СОХРАНЯЕТСЯ В ЭТОМ БРАУЗЕРЕ. ДАННЫЕ НЕ ОТПРАВЛЯЮТСЯ В БАРБЕРШОП.</p>
            </div>
          </aside>
        </div>
      </section>
      <section id="manifest" className="manifest"><span className="mono orange">THE BLACKWOOD CODE / 001</span><p>Стиль — не случайность.<br/><span className="muted">Это дисциплина деталей.</span></p></section>
    </main>
    <footer className="mono muted"><span>BLACKWOOD // GROOMING</span><span>НИЧЕГО ЛИШНЕГО. ДАЖЕ ЗДЕСЬ.</span><a href="#top">НАВЕРХ ↑</a></footer>
    {modal&&<div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget)setModal(false)}}>
      <div className="modal" ref={dialog} role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <button className="close" type="button" aria-label="Закрыть" onClick={()=>setModal(false)}>×</button>
        {success?<div>
          <div className="success-icon" aria-hidden="true">✓</div>
          <h2 id="dialog-title">ЗАПИСЬ<br/><span className="orange">СОХРАНЕНА.</span></h2>
          <p>{success.name}, твой пропуск готов.</p>
          <p className="mono">{fmt(date,{day:"numeric",month:"long",year:"numeric"})} / {success.time}<br/>{success.service}<br/>{success.master}<br/><br/>{money(success.total)}</p>
          <p className="booking-note">Запись сохранена локально на этом устройстве. Барбершоп не получил заявку: для реального бронирования требуется подключение сервера.</p>
          <button className="confirm" onClick={downloadBooking}>СКАЧАТЬ ПРОПУСК <span>↓</span></button>
          <button className="confirm" style={{background:"#2a2a2a",color:"#ecebe5"}} onClick={()=>setModal(false)}>ГОТОВО <span>↗</span></button>
        </div>:<form onSubmit={submit}>
          <span className="mono orange">FINAL STEP / ЛОКАЛЬНАЯ ЗАПИСЬ</span>
          <h2 id="dialog-title">ОСТАВЬ<br/>СВОИ ДАННЫЕ.</h2>
          <p className="mono muted">{fmt(date,{day:"numeric",month:"long"})} / {time} / {money(total)}</p>
          <label htmlFor="client-name" className="mono">КАК ТЕБЯ ЗОВУТ</label>
          <input id="client-name" autoComplete="given-name" name="name" required minLength="1" maxLength="80" value={name} onChange={e=>setName(e.target.value)} placeholder="Имя" />
          <label htmlFor="client-phone" className="mono">НОМЕР ТЕЛЕФОНА</label>
          <input id="client-phone" autoComplete="tel" name="phone" type="tel" inputMode="tel" required maxLength="25" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="+7 (___) ___-__-__" aria-describedby="phone-help" />
          <p id="phone-help" className="booking-note">11 цифр, начиная с +7 или 8. Данные сохраняются только в вашем браузере.</p>
          {error&&<p className="error" role="alert">{error}</p>}
          <button type="submit" className="confirm">СОХРАНИТЬ ЗАПИСЬ <span>↗</span></button>
        </form>}
      </div>
    </div>}
  </div>
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
